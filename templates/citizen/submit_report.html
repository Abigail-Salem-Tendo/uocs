{% extends "base.html" %}

{% block content %}
<h2>Report an Outage</h2>

<form method="POST" action="{{ url_for('citizen.report_outage') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div>
        <label for="area_name">Area / Location</label>
        <input
            type="text"
            id="area_name"
            name="area_name"
            list="location-suggestions"
            placeholder="e.g. Ntinda"
            required
        >
        <datalist id="location-suggestions">
            {% for loc in existing_locations %}
                <option value="{{ loc.area_name }}">
            {% endfor %}
        </datalist>
    </div>

    <input type="hidden" name="latitude" id="latitude">
    <input type="hidden" name="longitude" id="longitude">
    <p id="location-status" class="form-hint">Detecting your location…</p>

    <div>
        <label for="address">Address (optional)</label>
        <input type="text" id="address" name="address" placeholder="Street / landmark">
    </div>

    <div>
        <label for="utility_type_id">Utility Type</label>
        <select id="utility_type_id" name="utility_type_id" required>
            <option value="" disabled selected>Select type</option>
            {% for ut in utility_types %}
                <option value="{{ ut.id }}">{{ ut.name }}</option>
            {% endfor %}
        </select>
    </div>

    <div>
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="4" required></textarea>
    </div>

    <button type="submit">Submit Report</button>
</form>

<button type="submit">Submit Report</button>
</form>

<script>
const locationStatus = document.getElementById("location-status");

if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
    (position) => {
        document.getElementById("latitude").value = position.coords.latitude;
        document.getElementById("longitude").value = position.coords.longitude;
        locationStatus.textContent = "Location detected.";
    },
    (error) => {
        locationStatus.textContent =
        "Couldn't detect your location automatically. Please enable location access and try again.";
        console.error("Geolocation error:", error);
    }
    );
} else {
    locationStatus.textContent = "Your browser doesn't support automatic location detection.";
}
</script>
{% endblock %}
