{% extends "base.html" %}

{% block content %}
<h2>Notifications</h2>

{% if not notifications %}
    <p>No notifications yet.</p>
{% else %}
    <ul>
        {% for n in notifications %}
        <li>
            <p>{{ n.message }}</p>
            <span>{{ n.created_at.strftime('%Y-%m-%d %H:%M') }}</span>
        </li>
        {% endfor %}
    </ul>
{% endif %}
{% endblock %}
