{% extends "base.html" %}
{% block title %}Choose New Password - UOCS{% endblock %}

{% block content %}
    <h1>Choose a New Password</h1>

    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>New password: <input type="password" name="password" required></label><br>
        <label>Confirm password: <input type="password" name="confirm_password" required></label><br>
        <button type="submit">Update password</button>
    </form>

    <p><a href="{{ url_for('auth.login') }}">Back to login</a></p>
{% endblock %}
