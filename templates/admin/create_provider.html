{% extends "base.html" %}

{% block content %}
<h2>Create Provider Account</h2>

<form method="POST" action="{{ url_for('admin.create_provider') }}">
    <div>
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>
    </div>

    <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
    </div>

    <div>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
    </div>

    <div>
        <label for="utility_type_id">Utility Type</label>
        <select id="utility_type_id" name="utility_type_id">
            <option value="" selected>Unassigned (assign later)</option>
            {% for ut in utility_types %}
                <option value="{{ ut.id }}">{{ ut.name }}</option>
            {% endfor %}
        </select>
    </div>

    <button type="submit">Create Provider</button>
</form>
{% endblock %}
